services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kenabecha
      POSTGRES_PASSWORD: kenabecha
      POSTGRES_DB: kenabecha
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenabecha -d kenabecha"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      - WATCHPACK_POLLING=true
      # Container-network address of the API. Used only by Next's server side
      # (the /media rewrite + image optimizer), which can't reach the
      # browser-facing localhost:8000 from inside this container.
      - INTERNAL_API_URL=http://backend:8000
      # Public origin used for canonical links, Open Graph URLs and the
      # sitemap. Crawlers never resolve relative URLs, so this has to be
      # absolute and has to match how the site is actually reached.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  db_data:
  media_data:
