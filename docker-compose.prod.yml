# Routing note
# -----------
# There are deliberately no traefik.* labels here. Dokploy's Domains tab
# generates them, using the certificate-resolver and network names its own
# Traefik instance is configured with — hand-written labels have to guess
# both, and a wrong guess means certificates silently never issue.
#
# Configure in Dokploy → service → Domains:
#   kenabechaju.deshlet.com      → service: frontend, port 3000, HTTPS on
#   api.kenabechaju.deshlet.com  → service: backend,  port 8000, HTTPS on
#
# The API needs its own domain because the browser calls it directly, for
# every request and for the chat WebSocket (NEXT_PUBLIC_API_URL). Uploaded
# media does NOT need one: Next proxies /media to the backend over the
# container network (see next.config.ts), keeping image URLs same-origin.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kenabecha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kenabecha}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kenabecha} -d ${POSTGRES_DB:-kenabecha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kenabecha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kenabecha}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      ENV: production
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    # /health touches the database, so an unhealthy mark means the app really
    # cannot serve — not merely that the process is alive. start_period covers
    # the migration the entrypoint runs before uvicorn binds.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Server-side calls (sitemap, per-listing metadata) go over the
      # container network, not the public URL.
      INTERNAL_API_URL: http://backend:8000
    expose:
      - "3000"
    healthcheck:
      # wget is in the node:alpine base; no extra package needed.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      # service_healthy, not just started: the frontend's server-side render
      # (sitemap, per-listing metadata) calls the API, so starting before the
      # backend can answer produces a first paint with missing data.
      backend:
        condition: service_healthy

  # Nightly pg_dump into a named volume. Not a substitute for off-host
  # backups — a dump sitting on the same VPS is lost with the VPS — but it
  # makes "restore yesterday" possible, which is the common case (bad
  # migration, accidental delete) and was previously impossible.
  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-kenabecha}
      POSTGRES_DB: ${POSTGRES_DB:-kenabecha}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
               | gzip > "/backups/kenabecha-$$stamp.sql.gz.part"; then
            # Rename only after a clean dump, so a partial file from an
            # interrupted run is never mistaken for a usable backup.
            mv "/backups/kenabecha-$$stamp.sql.gz.part" "/backups/kenabecha-$$stamp.sql.gz"
            echo "backup ok: kenabecha-$$stamp.sql.gz"
          else
            echo "backup FAILED at $$stamp" >&2
            rm -f "/backups/kenabecha-$$stamp.sql.gz.part"
          fi
          find /backups -name 'kenabecha-*.sql.gz' -mtime "+$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  db_data:
  media_data:
  db_backups:
