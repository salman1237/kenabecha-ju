name: CI / Deploy

# Pull requests get the checks but never the deploy. Only a push to main can
# reach the VPS, and only after every check has passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push supersedes an in-flight run: without this, two deploys can
  # race and the older commit can land last.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migrations & tests
    runs-on: ubuntu-latest

    services:
      # A real Postgres, matching production's major version. The suite
      # depends on native enums, pg_trgm and ON CONFLICT, so a SQLite
      # stand-in would pass things production rejects.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kenabecha
          POSTGRES_PASSWORD: kenabecha
          POSTGRES_DB: kenabecha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kenabecha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://kenabecha:kenabecha@localhost:5432/kenabecha
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production
      ENV: test
      # app.main creates MEDIA_ROOT at import time. It defaults to /app/media,
      # which exists in the container but not on a runner, where / is not
      # writable. Left unset, importing the app raises PermissionError before
      # a single test runs. The app is deliberately strict here — an
      # unwritable media directory means uploads fail — so CI supplies a
      # writable path rather than the app being made lenient. A literal path,
      # not ${{ runner.temp }} — the `runner` context does not exist in a
      # job-level env block, and referencing it makes GitHub reject the whole
      # workflow before any job starts.
      MEDIA_ROOT: /tmp/kenabecha-media

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrations apply cleanly from empty
        working-directory: backend
        run: alembic upgrade head

      - name: Models match migrations
        working-directory: backend
        # Catches a model changed without a migration — drift that otherwise
        # only shows up as a 500 in production.
        run: alembic check

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend — types & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        # npm ci, not install: fails loudly on lockfile drift instead of
        # silently resolving different versions than were tested.
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # Turbopack dev does not typecheck, so this is the only thing
        # standing between a type error and a broken production build.
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  deploy:
    name: Deploy to VPS (Dokploy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Both gates: never on a pull request, and never on a red build. `needs`
    # already implies success, but being explicit means a later edit to this
    # file cannot loosen it by accident.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK is not set. Add it under" \
                 "Settings → Secrets and variables → Actions."
            exit 1
          fi
          # -f so a non-2xx response fails the job rather than reporting a
          # green deploy that never happened.
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST "$WEBHOOK")
          echo "Dokploy responded $code"
          cat /tmp/body || true
          case "$code" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::error::Dokploy rejected the deploy (HTTP $code)."; exit 1 ;;
          esac

      - name: Wait for the new version to answer
        env:
          # The API host, not the site host — /health is a backend route.
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL not set — skipping the post-deploy check."
            exit 0
          fi
          # Dokploy returns as soon as the build is queued, so a green job
          # here would otherwise say nothing about whether the site came
          # back up. Poll /health until it answers or we give up.
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$API_URL/health" >/dev/null 2>&1; then
              echo "Healthy after ~$((i * 15))s."
              exit 0
            fi
            sleep 15
          done
          echo "::error::$API_URL/health did not recover within 10 minutes."
          exit 1
