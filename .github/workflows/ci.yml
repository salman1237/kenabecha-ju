name: CI

# Dokploy watches the repo directly and redeploys on its own after every
# push to main — this workflow is checks only, no deploy step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push supersedes an in-flight run rather than queuing behind it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migrations & tests
    runs-on: ubuntu-latest

    services:
      # A real Postgres, matching production's major version. The suite
      # depends on native enums, pg_trgm and ON CONFLICT, so a SQLite
      # stand-in would pass things production rejects.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kenabecha
          POSTGRES_PASSWORD: kenabecha
          POSTGRES_DB: kenabecha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kenabecha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://kenabecha:kenabecha@localhost:5432/kenabecha
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production
      ENV: test
      # app.main creates MEDIA_ROOT at import time. It defaults to /app/media,
      # which exists in the container but not on a runner, where / is not
      # writable. Left unset, importing the app raises PermissionError before
      # a single test runs. The app is deliberately strict here — an
      # unwritable media directory means uploads fail — so CI supplies a
      # writable path rather than the app being made lenient. A literal path,
      # not ${{ runner.temp }} — the `runner` context does not exist in a
      # job-level env block, and referencing it makes GitHub reject the whole
      # workflow before any job starts.
      MEDIA_ROOT: /tmp/kenabecha-media

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrations apply cleanly from empty
        working-directory: backend
        run: alembic upgrade head

      - name: Models match migrations
        working-directory: backend
        # Catches a model changed without a migration — drift that otherwise
        # only shows up as a 500 in production.
        run: alembic check

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend — types & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        # npm ci, not install: fails loudly on lockfile drift instead of
        # silently resolving different versions than were tested.
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # Turbopack dev does not typecheck, so this is the only thing
        # standing between a type error and a broken production build.
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build
