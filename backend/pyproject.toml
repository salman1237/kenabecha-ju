[project]
name = "kenabecha-ju-backend"
version = "0.1.0"
description = "KenaBecha JU marketplace backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.12",
    "google-auth>=2.35",
    "requests>=2.32",
    "redis>=5.2",
]

# An optional-dependency extra rather than a PEP 735 dependency-group:
# `pip install --group` needs pip >= 25.1 and the image ships 25.0, whereas
# every pip understands extras. Installed only in the dev image stage, so the
# production image never carries the test toolchain.
# `find` with an include filter, not an explicit `packages = ["app"]` list.
#
# Two contexts have to work:
#   * a full checkout (CI), where `app`, `alembic` and `media` sit side by side
#     and bare auto-discovery fails with "Multiple top-level packages
#     discovered in a flat-layout";
#   * the Docker build, which copies pyproject.toml and installs *before*
#     copying the source, so `app/` does not exist yet.
#
# An explicit list satisfies the first and breaks the second — setuptools
# insists a named package directory exists ("package directory 'app' does not
# exist"). `find` simply matches nothing there, and selects only `app` when
# the source is present. Verified against both layouts.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Session-scoped async fixtures (the engine and the migrated schema) must
# share one event loop with the tests that use them; the default per-function
# loop would close it out from under them.
asyncio_default_fixture_loop_scope = "session"
# Tests share that same loop. SQLAlchemy's async engine pools asyncpg
# connections against whichever loop first used them, so a per-test loop
# makes every reuse fail with "attached to a different loop".
asyncio_default_test_loop_scope = "session"
markers = [
    "keep_seed: leave migration-seeded rows in place instead of clearing them",
]
